name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest

  production-smoke:
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke-test.sh

  browser:
    runs-on: ubuntu-latest
    needs: [client, server]
    env:
      COMPOSE_PROJECT_NAME: bianco-e2e
      BIANCO_SYNC_TOKEN: e2e-sync-token
      BIANCO_SECRET_KEY: e2e-secret-key-at-least-32-characters
      BIANCO_AUTH_USER: smoke-user
      BIANCO_AUTH_PASSWORD_HASH: $2y$05$T2WROzC9udzG22f01YRqC.3GbfaqzFbi04ifCy/HU.F0pON7o6/sm
      BIANCO_SITE_ADDRESS: :80
      BIANCO_BIND_ADDRESS: 127.0.0.1
      BIANCO_HTTP_PORT: 8089
      BIANCO_TEST_AUTH_USER: smoke-user
      BIANCO_TEST_AUTH_PASSWORD: smoke-password
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8089
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium webkit
        working-directory: client
      - run: docker compose up -d --build
      - name: Wait for Bianco
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8089/auth/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm run test:e2e
        working-directory: client
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v --remove-orphans
