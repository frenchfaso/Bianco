<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7faf9" />
    <meta name="description" content="Clear receipts, even offline." />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Bianco</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div
      x-data="biancoApp"
      x-init="init()"
      x-cloak
      class="app-shell"
      :class="{ 'capture-editing': view === 'capture' && capture.originalUrl }"
    >
      <header class="app-header container">
        <a href="#" class="brand" @click.prevent="showDashboard" :aria-label="t('brand.homeAria')">
          <img src="/icon.svg" width="38" height="38" alt="" />
          <span>Bianco<small x-text="t('brand.tagline')"></small></span>
        </a>
        <div class="header-actions">
          <span
            class="connection-pill"
            :class="{ offline: !online, paused: online && syncStatus === 'error', syncing: online && syncStatus === 'syncing', online: online && syncStatus === 'idle', local: online && syncStatus === 'disabled' }"
            role="status"
            aria-live="polite"
          >
            <span aria-hidden="true">●</span>
            <span x-text="online ? syncLabel : t('connection.offline')"></span>
          </span>
          <button
            class="header-settings"
            :class="{ active: settingsOpen }"
            @click="openSettings($event)"
            :aria-label="t('settings.openAria')"
            :title="t('settings.openAria')"
            aria-haspopup="dialog"
            aria-controls="settings-dialog"
            :aria-expanded="settingsOpen"
          >
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </header>

      <main class="container app-main">
        <section x-show="loading" class="loading-state">
          <span aria-busy="true" x-text="t('common.loadingArchive')"></span>
        </section>

        <section x-show="!loading && view === 'dashboard'" aria-labelledby="dashboard-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow" x-text="t('dashboard.eyebrow')"></p>
              <h1 id="dashboard-title" x-text="t('dashboard.title')"></h1>
            </div>
          </div>

          <div class="summary-grid" :class="{ single: attentionCount === 0 }">
            <article class="hero-total">
              <small x-text="t('dashboard.periodSpend')"></small>
              <strong x-text="money(insights.total)"></strong>
              <p x-show="insights.previousTotal > 0" :class="insights.difference > 0 ? 'negative' : 'positive'">
                <span x-text="signedMoney(insights.difference)"></span>
                <span x-show="insights.changePercent !== null" x-text="` · ${signedPercent(insights.changePercent)}`"></span>
                <small x-text="t('dashboard.previousComparison')"></small>
              </p>
              <p x-show="insights.previousTotal === 0"><small x-text="t('dashboard.noPreviousComparison')"></small></p>
              <p x-show="insights.excludedCurrencyCount > 0">
                <small x-text="t('dashboard.otherCurrenciesExcluded', { count: insights.excludedCurrencyCount })"></small>
              </p>
            </article>
            <article x-show="attentionCount > 0" class="attention-summary">
              <small x-text="t('dashboard.needsAttention')"></small>
              <strong x-text="attentionCount"></strong>
              <button class="outline compact" @click="view = 'archive'" x-text="t('dashboard.reviewReceipts')"></button>
            </article>
          </div>

          <div class="dashboard-grid">
            <article>
              <div class="card-heading">
                <h2 x-text="t('dashboard.categories.title')"></h2>
                <small x-text="money(insights.total)"></small>
              </div>
              <div class="chart-wrap category-chart-wrap" x-ref="categoryChartContainer" x-show="insights.categories.some((entry) => entry.total > 0)">
                <canvas x-ref="categoryChart" role="img" :aria-label="t('dashboard.categories.chartAria')"></canvas>
              </div>
              <p class="empty-copy" x-show="!insights.categories.some((entry) => entry.total > 0)" x-text="t('dashboard.categories.empty')"></p>
              <div class="compact-list">
                <template x-for="entry in insights.categories.filter((item) => item.total > 0).slice(0, 5)" :key="entry.id">
                  <div><span x-text="categoryLabel(entry.id)"></span><strong x-text="money(entry.total)"></strong></div>
                </template>
              </div>
            </article>

            <article>
              <div class="card-heading"><h2 x-text="t('dashboard.insights.title')"></h2></div>
              <ul class="insight-list" x-show="!aiSummaryCurrent && insights.deterministic.length">
                <template x-for="entry in insights.deterministic" :key="`${entry.type}-${entry.id}`">
                  <li x-text="insightText(entry)"></li>
                </template>
              </ul>
              <p class="empty-copy" x-show="!aiSummaryCurrent && !insights.deterministic.length" x-text="t('dashboard.insights.empty')"></p>
              <div x-show="settings.aiSummary && aiSummaryCurrent" class="ai-summary">
                <small x-text="t('dashboard.insights.aiAggregatedOnly')"></small>
                <ul>
                  <template x-for="observation in (settings.aiSummary?.observations || [])" :key="observation">
                    <li x-text="observation"></li>
                  </template>
                </ul>
                <p x-show="settings.aiSummary?.suggestion" x-text="settings.aiSummary?.suggestion"></p>
              </div>
              <button
                x-show="activeProvider"
                class="secondary outline compact"
                @click="generateAiSummary"
                :disabled="busy"
                x-text="t(aiSummaryCurrent ? 'dashboard.insights.refresh' : 'dashboard.insights.generate')"
              ></button>
            </article>
          </div>

          <article class="spending-trend-card">
            <div class="card-heading">
              <div>
                <h2 x-text="t('dashboard.spendingTrend.title')"></h2>
                <small x-text="t('dashboard.spendingTrend.lastPeriods', { count: 12 })"></small>
              </div>
              <div class="chart-period-switch" role="group" :aria-label="t('dashboard.spendingTrend.periodAria')">
                <button
                  type="button"
                  class="outline compact"
                  :class="{ active: spendingGranularity === 'week' }"
                  :aria-pressed="spendingGranularity === 'week'"
                  @click="setSpendingGranularity('week')"
                  x-text="t('dashboard.spendingTrend.weekly')"
                ></button>
                <button
                  type="button"
                  class="outline compact"
                  :class="{ active: spendingGranularity === 'month' }"
                  :aria-pressed="spendingGranularity === 'month'"
                  @click="setSpendingGranularity('month')"
                  x-text="t('dashboard.spendingTrend.monthly')"
                ></button>
              </div>
            </div>
            <div
              class="chart-wrap spending-chart-wrap"
              x-ref="spendingChartContainer"
              x-show="(spendingGranularity === 'week' ? insights.spending.weekly : insights.spending.monthly).some((entry) => entry.total > 0)"
            >
              <canvas x-ref="spendingChart" role="img" :aria-label="t('dashboard.spendingTrend.chartAria')"></canvas>
            </div>
            <p
              class="empty-copy"
              x-show="!(spendingGranularity === 'week' ? insights.spending.weekly : insights.spending.monthly).some((entry) => entry.total > 0)"
              x-text="t('dashboard.spendingTrend.empty')"
            ></p>
          </article>

          <details class="dashboard-drilldown" x-show="insights.merchants.some((entry) => entry.total > 0) || insights.products.length">
            <summary x-text="t('dashboard.details')"></summary>
            <div class="dashboard-grid">
              <article>
                <div class="card-heading"><h2 x-text="t('dashboard.merchants.title')"></h2></div>
                <ol class="rank-list">
                  <template x-for="entry in insights.merchants.filter((item) => item.total > 0).slice(0, 5)" :key="entry.id">
                    <li><span><strong x-text="merchantLabel(entry.id)"></strong><small x-text="t('dashboard.merchants.purchases', { count: entry.count })"></small></span><b x-text="money(entry.total)"></b></li>
                  </template>
                </ol>
              </article>
              <article>
                <div class="card-heading"><h2 x-text="t('dashboard.products.title')"></h2></div>
                <ol class="rank-list">
                  <template x-for="entry in insights.products.slice(0, 5)" :key="entry.id">
                    <li><span><strong x-text="entry.id"></strong><small x-text="t('dashboard.products.quantityFrequency', { quantity: t('dashboard.products.units', { count: entry.quantity }), frequency: t('dashboard.products.times', { count: entry.frequency }) })"></small></span><b x-text="money(entry.total)"></b></li>
                  </template>
                </ol>
              </article>
            </div>
          </details>
        </section>

        <section x-show="!loading && view === 'archive'" aria-labelledby="archive-title">
          <div class="section-heading">
            <div><p class="eyebrow" x-text="t('archive.eyebrow')"></p><h1 id="archive-title" x-text="t('archive.title')"></h1></div>
            <button class="compact" @click="newManual" x-text="t('archive.addManual')"></button>
          </div>
          <div class="filter-grid">
            <input type="search" x-model.debounce.200ms="filters.search" :placeholder="t('archive.searchPlaceholder')" :aria-label="t('archive.searchAria')" />
            <select x-model="filters.category" :aria-label="t('archive.categoryFilterAria')">
              <option value="" x-text="t('archive.allCategories')"></option>
              <template x-for="category in categories" :key="category.id"><option :value="category.id" x-text="categoryLabel(category.id)"></option></template>
            </select>
            <select x-model="filters.period" :aria-label="t('archive.periodFilterAria')">
              <option value="all" x-text="t('archive.period.all')"></option>
              <option value="month" x-text="t('archive.period.currentMonth')"></option>
              <option value="previous" x-text="t('archive.period.previousMonth')"></option>
              <option value="year" x-text="t('archive.period.currentYear')"></option>
            </select>
          </div>
          <div class="receipt-list">
            <template x-for="receipt in filteredReceipts" :key="receipt.id">
              <button class="receipt-row" @click="openReceipt(receipt.id)">
                <span class="receipt-mark" :style="`--mark:${categoryColor(receipt.categoryId)}`"></span>
                <span class="receipt-copy">
                  <strong x-text="receipt.merchantNormalized || receipt.merchantRaw || t('archive.unknownMerchant')"></strong>
                  <small><span x-text="date(receipt.transactionDate || receipt.capturedAt)"></span> · <span x-text="categoryLabel(receipt.categoryId)"></span></small>
                </span>
                <span class="receipt-value"><strong x-text="receipt.totalMinor === null ? '—' : money(receipt.totalMinor, receipt.currency)"></strong><small :class="`status ${receiptEditNeedsAttention(receipt.id) ? 'needs_review' : receipt.status}`" x-text="receiptEditNeedsAttention(receipt.id) ? t('receiptDetail.syncReview') : statusLabel(receipt.status)"></small></span>
              </button>
            </template>
            <article class="empty-state" x-show="!filteredReceipts.length">
              <h2 x-text="t('archive.empty.title')"></h2>
              <p x-text="t('archive.empty.description')"></p>
              <button @click="view = 'capture'" x-text="t('archive.empty.capture')"></button>
            </article>
          </div>
        </section>

        <section x-show="!loading && view === 'capture'" class="capture-section" aria-labelledby="capture-title">
          <div class="section-heading"><div><p class="eyebrow" x-text="t('capture.eyebrow')"></p><h1 id="capture-title" x-text="t('capture.title')"></h1></div></div>
          <article class="capture-card">
            <div x-show="!capture.originalUrl && !capture.processing" class="capture-options">
              <div class="capture-icon" aria-hidden="true">▣</div>
              <h2 x-text="t('capture.frameTitle')"></h2>
              <p x-text="t('capture.frameDescription')"></p>
              <label for="camera-input" role="button" x-text="t('capture.openCamera')"></label>
              <input id="camera-input" type="file" accept="image/*" capture="environment" hidden @change="previewFile($event)" />
              <label for="gallery-input" role="button" class="secondary outline" x-text="t('capture.chooseGallery')"></label>
              <input id="gallery-input" type="file" accept="image/*" hidden @change="previewFile($event)" />
              <button class="contrast outline" @click="newManual" x-text="t('capture.manual')"></button>
            </div>
            <div x-show="capture.processing" class="capture-options" aria-live="polite" aria-busy="true">
              <div class="capture-icon" aria-hidden="true">▣</div>
              <p x-text="capture.saving ? t('capture.applyingCorrection') : t('capture.preparingPreview')"></p>
            </div>
            <div x-show="capture.originalUrl && !capture.processing" class="capture-preview">
              <p class="crop-status" x-text="capture.detected ? t('capture.cropDetected') : t('capture.cropFallback')"></p>
              <p class="crop-hint" x-text="t('capture.cropHint')"></p>
              <svg
                x-ref="cropEditor"
                class="crop-editor"
                viewBox="0 0 1 1"
                x-effect="$el.setAttribute('viewBox', `0 0 ${capture.width || 1} ${capture.height || 1}`)"
                role="img"
                :aria-label="t('capture.cropEditorAria')"
                @pointermove="updateCropCorner($event)"
                @pointerup="stopCropCorner($event)"
                @pointercancel="stopCropCorner($event)"
              >
                <image :href="capture.originalUrl" x="0" y="0" :width="capture.width" :height="capture.height" preserveAspectRatio="none"></image>
                <polygon class="crop-polygon" :class="{ invalid: !cropQuadValid() }" :points="cropPolygonPoints()"></polygon>
                <circle class="crop-handle" :cx="capture.quad?.[0]?.x || 0" :cy="capture.quad?.[0]?.y || 0" :r="cropHandleRadius()" tabindex="0" :aria-label="t('capture.cropCornerAria', { index: 1 })" @pointerdown="startCropCorner(0, $event)" @lostpointercapture="stopCropCorner($event)"></circle>
                <circle class="crop-handle" :cx="capture.quad?.[1]?.x || 0" :cy="capture.quad?.[1]?.y || 0" :r="cropHandleRadius()" tabindex="0" :aria-label="t('capture.cropCornerAria', { index: 2 })" @pointerdown="startCropCorner(1, $event)" @lostpointercapture="stopCropCorner($event)"></circle>
                <circle class="crop-handle" :cx="capture.quad?.[2]?.x || 0" :cy="capture.quad?.[2]?.y || 0" :r="cropHandleRadius()" tabindex="0" :aria-label="t('capture.cropCornerAria', { index: 3 })" @pointerdown="startCropCorner(2, $event)" @lostpointercapture="stopCropCorner($event)"></circle>
                <circle class="crop-handle" :cx="capture.quad?.[3]?.x || 0" :cy="capture.quad?.[3]?.y || 0" :r="cropHandleRadius()" tabindex="0" :aria-label="t('capture.cropCornerAria', { index: 4 })" @pointerdown="startCropCorner(3, $event)" @lostpointercapture="stopCropCorner($event)"></circle>
              </svg>
              <div class="crop-magnifier" x-show="cropLens.active" :style="cropMagnifierStyle()" aria-hidden="true"></div>
              <p class="crop-error" role="alert" x-show="capture.quad && !cropQuadValid()" x-text="t('capture.cropInvalid')"></p>
              <div class="button-row">
                <button class="secondary outline" @click="resetCapture" :disabled="capture.saving" x-text="t('capture.retry')"></button>
                <button @click="confirmCapture" :aria-busy="capture.saving" :disabled="capture.saving || !cropQuadValid()" x-text="t('capture.confirm')"></button>
              </div>
            </div>
          </article>
        </section>
      </main>

      <nav class="bottom-nav" :aria-label="t('nav.mainAria')">
        <button :class="{ active: view === 'dashboard' }" @click="showDashboard"><span class="bottom-nav-icon" aria-hidden="true">◫</span><span class="bottom-nav-label" x-text="t('nav.dashboard')"></span></button>
        <button class="capture-nav" :class="{ active: view === 'capture' }" @click="view = 'capture'"><span class="bottom-nav-icon" aria-hidden="true">＋</span><span class="bottom-nav-label" x-text="t('nav.capture')"></span></button>
        <button :class="{ active: view === 'archive' }" @click="view = 'archive'"><span class="bottom-nav-icon" aria-hidden="true">≡</span><span class="bottom-nav-label" x-text="t('nav.archive')"></span></button>
      </nav>

      <dialog id="settings-dialog" x-ref="settingsDialog" class="settings-dialog" aria-labelledby="settings-title" @close="onSettingsClosed">
        <article class="settings-dialog-shell">
          <header class="settings-dialog-header">
            <div>
              <p class="eyebrow" x-text="t('settings.eyebrow')"></p>
              <h2 id="settings-title" x-ref="settingsTitle" tabindex="-1" x-text="t('settings.title')"></h2>
            </div>
            <button class="close-button" :aria-label="t('settings.closeAria')" @click="closeSettings">×</button>
          </header>

          <div class="settings-grid">
            <article>
              <h3 x-text="t('settings.appearance.title')"></h3>
              <label><span x-text="t('settings.appearance.themeLabel')"></span>
                <select x-model="themePreference" @change="updateThemePreference($event.target.value)">
                  <option value="auto" x-text="t('settings.appearance.themeAuto')"></option>
                  <option value="light" x-text="t('settings.appearance.themeLight')"></option>
                  <option value="dark" x-text="t('settings.appearance.themeDark')"></option>
                </select>
              </label>
              <label><span x-text="t('settings.appearance.languageLabel')"></span>
                <select x-model="languagePreference" @change="updateLanguagePreference($event.target.value)">
                  <option value="auto" x-text="t('settings.appearance.languageAuto')"></option>
                  <option value="en" x-text="t('settings.appearance.languageEn')"></option>
                  <option value="it" x-text="t('settings.appearance.languageIt')"></option>
                  <option value="de" x-text="t('settings.appearance.languageDe')"></option>
                  <option value="es" x-text="t('settings.appearance.languageEs')"></option>
                  <option value="fr" x-text="t('settings.appearance.languageFr')"></option>
                </select>
              </label>
            </article>

            <article>
              <h3 x-text="t('settings.ai.title')"></h3>
              <p class="muted" x-show="!providers.length" x-text="t('settings.ai.unavailableOffline')"></p>
              <div x-show="providers.length">
                <label><span x-text="t('settings.ai.provider')"></span>
                  <select x-model="providerForm.id" @change="selectAiProvider($event.target.value)">
                    <template x-for="provider in providers" :key="`config-${provider.id}`">
                      <option :value="provider.id" x-text="providerLabel(provider)"></option>
                    </template>
                  </select>
                </label>
                <div x-show="providerForm.id === 'openai'" class="openai-subscription">
                  <p class="muted" x-text="t('settings.ai.chatgptDescription')"></p>
                  <template x-if="!editingProvider?.chatgptConnected">
                    <div>
                      <button type="button" @click="connectOpenAiSubscription" :aria-busy="providerBusy" x-text="t('settings.ai.connectChatgpt')"></button>
                      <div class="device-login" x-show="openAiLogin?.status === 'pending'">
                        <span x-text="t('settings.ai.deviceCode')"></span>
                        <strong x-text="openAiLogin?.userCode"></strong>
                        <div class="device-login-actions">
                          <button type="button" class="secondary" @click="openOpenAiVerification" x-text="t('settings.ai.openOpenAi')"></button>
                          <button type="button" class="outline" @click="copyOpenAiCode" x-text="t('settings.ai.copyCode')"></button>
                        </div>
                        <small x-text="t('settings.ai.deviceCodeHint')"></small>
                      </div>
                    </div>
                  </template>
                  <template x-if="editingProvider?.chatgptConnected">
                    <div>
                      <p class="subscription-status"><span x-text="t('settings.ai.connectedPlan')"></span> <strong x-text="editingProvider?.planType || t('common.notAvailable')"></strong></p>
                      <button type="button" class="outline compact" @click="disconnectOpenAiSubscription" :aria-busy="providerBusy" x-text="t('settings.ai.disconnectChatgpt')"></button>
                    </div>
                  </template>
                </div>
                <label x-show="providerForm.id !== 'openai'"><span x-text="t('settings.ai.endpoint')"></span>
                  <input type="url" x-model="providerForm.baseUrl" @input.debounce.700ms="validateProviderConnection" :placeholder="providerForm.id === 'ollama' ? 'http://host.containers.internal:11434' : 'https://…'" autocomplete="off" spellcheck="false" />
                </label>
                <p class="muted" x-show="providerForm.id === 'ollama'" x-text="t('settings.ai.ollamaEndpointHint')"></p>
                <label x-show="providerForm.id === 'openai-compatible'">
                  <span x-text="editingProvider?.requiresApiKey ? t('settings.ai.apiKey') : t('settings.ai.apiKeyOptional')"></span>
                  <input type="password" x-model="providerForm.apiKey" @change="validateProviderConnection" autocomplete="new-password" :placeholder="editingProvider?.hasApiKey ? t('settings.ai.savedKeyPlaceholder') : t('settings.ai.newKeyPlaceholder')" />
                </label>
                <label x-show="providerForm.id === 'openai-compatible' && editingProvider?.hasApiKey">
                  <input type="checkbox" role="switch" x-model="providerForm.clearApiKey" @change="validateProviderConnection" /> <span x-text="t('settings.ai.removeSavedKey')"></span>
                </label>
                <p class="muted" role="status" aria-live="polite" :class="providerConnectionState === 'error' ? 'negative' : ''" x-text="providerConnectionMessage"></p>
                <p class="muted" x-show="activeProvider"><span x-text="t('settings.ai.active')"></span> <strong x-text="providerLabel(activeProvider)"></strong></p>
              </div>
              <p class="muted" x-text="t('settings.ai.securityNote')"></p>
            </article>

            <article>
              <h3 x-text="t('settings.backup.title')"></h3>
              <button class="secondary" @click="exportBackup" :aria-busy="busy" x-text="t('settings.backup.export')"></button>
              <p class="muted" x-text="t('settings.backup.estimatedSpace', { usage: storageUsage })"></p>
            </article>

            <article>
              <h3 x-text="t('settings.account.title')"></h3>
              <p x-text="t('settings.account.description')"></p>
              <form method="post" action="/auth/logout">
                <button type="submit" class="outline" x-text="t('settings.account.signOut')"></button>
              </form>
              <button type="button" class="outline danger" :disabled="!online || busy" @click="logoutAndWipeLocalData" x-text="t('settings.account.signOutAndDelete')"></button>
            </article>

            <article class="danger-zone">
              <h3 x-text="t('settings.privacy.title')"></h3>
              <p x-text="t('settings.privacy.description')"></p>
              <button class="outline danger" @click="wipeLocalData" x-text="t('settings.privacy.deleteAll')"></button>
            </article>

          </div>
          <div class="toast dialog-toast" x-show="toast.message && settingsOpen" x-transition :class="toast.type" x-text="toast.message"></div>
        </article>
      </dialog>

      <dialog
        id="confirmation-dialog"
        x-ref="confirmationDialog"
        aria-labelledby="confirmation-title"
        @cancel.prevent="finishConfirmation(false)"
        @close="onConfirmationClosed"
      >
        <article>
          <header>
            <h2 id="confirmation-title" x-ref="confirmationTitle" tabindex="-1" x-text="confirmation.title"></h2>
            <button class="close-button" :aria-label="t('common.close')" @click="finishConfirmation(false)">×</button>
          </header>
          <p x-text="confirmation.message"></p>
          <footer class="confirmation-actions">
            <button class="outline" @click="finishConfirmation(false)" x-text="t('common.cancel')"></button>
            <button :class="{ danger: confirmation.destructive }" @click="finishConfirmation(true)" x-text="confirmation.confirmLabel"></button>
          </footer>
        </article>
      </dialog>

      <div class="modal-backdrop" x-show="detail.open" x-transition.opacity @click.self="closeDetail" @keydown.escape.window="if (detail.open && !imageViewerOpen) closeDetail()">
        <article class="receipt-detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
          <header>
            <div><p class="eyebrow" x-text="statusLabel(detail.form.status)"></p><h2 id="detail-title" x-text="t('receiptDetail.title')"></h2></div>
            <button class="close-button" :aria-label="t('receiptDetail.close')" @click="closeDetail">×</button>
          </header>
          <div class="detail-layout">
            <div>
              <div
                class="magnifier-surface"
                x-show="detail.imageUrl || detail.fullImageUrl"
                @mouseenter="hoverMagnifier($event)"
                @mousemove="moveMagnifier($event)"
                @mouseleave="stopMagnifier($event)"
                @pointerdown="beginMagnifier($event)"
                @pointermove="if ($event.pointerType !== 'mouse') moveMagnifier($event)"
                @pointerup="releaseMagnifier($event)"
                @pointercancel="releaseMagnifier($event)"
                @lostpointercapture="releaseMagnifier($event)"
              >
                <img :src="detail.fullImageUrl || detail.imageUrl" :alt="t('receiptDetail.photoAlt')" draggable="false" />
                <span class="magnifier-lens" x-show="detail.lens.active" :style="magnifierStyle()" aria-hidden="true"></span>
              </div>
              <small class="magnifier-hint" x-show="detail.imageUrl || detail.fullImageUrl" x-text="t('receiptDetail.magnifierHint')"></small>
              <div class="image-placeholder" x-show="!detail.imageUrl && !detail.fullImageUrl" x-text="t('receiptDetail.noLocalImage')"></div>
              <div
                class="image-actions"
                x-show="detail.imageUrl || detail.fullImageUrl"
                :class="{ 'single-action': ['queued', 'processing'].includes(detail.form.status) }"
              >
                <button
                  type="button"
                  class="secondary outline compact full-image-button"
                  :aria-busy="detail.fullLoading"
                  :disabled="detail.fullLoading"
                  @click="loadFullImage($event)"
                  x-text="detail.fullLoading ? t('receiptDetail.loadingFullImage') : t('receiptDetail.openFullImage')"
                ></button>
                <button
                  type="button"
                  class="secondary outline compact"
                  x-show="detail.form.status === 'failed'"
                  @click="retryAi"
                  x-text="t('receiptDetail.retryProcessing')"
                ></button>
                <button
                  type="button"
                  class="secondary outline compact"
                  x-show="detail.form.imageHash && !['queued', 'processing', 'failed'].includes(detail.form.status)"
                  @click="reanalyzeAi"
                  x-text="t('receiptDetail.reanalyze')"
                ></button>
              </div>
            </div>
            <form @submit.prevent="saveDetail" @input="detail.dirty = true" @change="detail.dirty = true">
              <div x-show="detail.editStatus === 'conflict' || detail.editStatus === 'rejected'" role="status">
                <p class="muted" x-text="t(detail.editStatus === 'conflict' ? 'error.receiptConflict' : 'error.saveFailed')"></p>
                <button type="button" class="outline compact" @click="useSyncedReceipt" :disabled="!online || busy" x-text="t('receiptDetail.useSynced')"></button>
              </div>
              <div class="form-grid">
                <label class="span-2"><span x-text="t('receiptDetail.merchant')"></span><input x-model="detail.form.merchantNormalized" :placeholder="t('receiptDetail.merchantPlaceholder')" /></label>
                <label><span x-text="t('receiptDetail.date')"></span><input type="date" x-model="detail.form.transactionDate" /></label>
                <label><span x-text="t('receiptDetail.total', { currency: detail.form.currency || settings.defaultCurrency })"></span><input type="number" min="0" step="0.01" inputmode="decimal" x-model="detail.form.totalEuro" /></label>
                <label><span x-text="t('receiptDetail.currency')"></span><input maxlength="3" x-model="detail.form.currency" /></label>
              </div>
              <div class="items-heading"><h3 x-text="t('receiptDetail.products')"></h3><button type="button" class="outline compact" @click="addItem" x-text="t('receiptDetail.addProduct')"></button></div>
              <div class="item-editor">
                <template x-for="(item, index) in detail.items" :key="item.id">
                  <fieldset>
                    <input x-model="item.normalizedName" :aria-label="t('receiptDetail.productNameAria', { index: index + 1 })" :placeholder="t('receiptDetail.productPlaceholder')" />
                    <input type="number" min="0" step="0.01" x-model="item.quantity" :aria-label="t('receiptDetail.quantityAria', { index: index + 1 })" :placeholder="t('receiptDetail.quantityPlaceholder')" />
                    <input type="number" min="0" step="0.01" x-model="item.unitPriceEuro" :aria-label="t('receiptDetail.unitPriceAria', { index: index + 1 })" :placeholder="t('receiptDetail.unitPricePlaceholder', { currency: detail.form.currency || settings.defaultCurrency })" />
                    <input type="number" min="0" step="0.01" x-model="item.totalPriceEuro" :aria-label="t('receiptDetail.productTotalAria', { index: index + 1 })" :placeholder="t('receiptDetail.productTotalPlaceholder', { currency: detail.form.currency || settings.defaultCurrency })" />
                    <select x-model="item.categoryId" :aria-label="t('receiptDetail.productCategoryAria', { index: index + 1 })"><template x-for="category in categories" :key="category.id"><option :value="category.id" x-text="categoryLabel(category.id)"></option></template></select>
                    <button type="button" class="close-button" @click="removeItem(index)" :aria-label="t('receiptDetail.deleteProductAria', { index: index + 1 })">×</button>
                  </fieldset>
                </template>
                <p class="empty-copy" x-show="!detail.items.length" x-text="t('receiptDetail.noProducts')"></p>
              </div>
              <div class="detail-actions">
                <button type="button" class="outline danger" :disabled="busy" @click="removeCurrentReceipt" x-text="t('receiptDetail.delete')"></button>
                <span class="spacer"></span>
                <button type="submit" :aria-busy="busy" :disabled="busy" x-text="t('receiptDetail.save')"></button>
              </div>
            </form>
          </div>
        </article>
      </div>

      <dialog
        id="image-viewer-dialog"
        x-ref="imageViewerDialog"
        :aria-label="t('receiptDetail.fullImageTitle')"
        @cancel.prevent="closeImageViewer"
        @close="onImageViewerClosed"
        @keydown.escape.window="if (imageViewerOpen) { $event.preventDefault(); closeImageViewer() }"
        @click="if ($event.target === $el) closeImageViewer()"
      >
        <button
          class="close-button image-viewer-close"
          x-ref="imageViewerClose"
          :aria-label="t('receiptDetail.closeFullImage')"
          @click="closeImageViewer"
        >×</button>
        <img :src="detail.fullImageUrl" :alt="t('receiptDetail.photoAlt')" />
      </dialog>

      <div class="toast-stack">
        <section
          class="action-toast"
          x-show="updateAvailable"
          x-transition
          role="status"
          aria-live="polite"
        >
          <div class="action-toast-copy">
            <strong x-text="t('pwa.updateAvailable')"></strong>
          </div>
          <div class="action-toast-actions">
            <button class="compact" @click="applyUpdate" x-text="t('pwa.update')"></button>
          </div>
        </section>
        <section
          class="action-toast"
          x-show="installSuggestionVisible"
          x-transition
          role="region"
          aria-labelledby="install-suggestion-title"
        >
          <div class="action-toast-copy">
            <strong id="install-suggestion-title" x-text="t('pwa.installTitle')"></strong>
            <span x-text="t('pwa.installDescription')"></span>
          </div>
          <div class="action-toast-actions">
            <button class="compact" @click="installApp" x-text="t('pwa.install')"></button>
            <button class="outline compact" @click="dismissInstallSuggestion" x-text="t('pwa.notNow')"></button>
          </div>
        </section>
        <div class="toast" x-show="toast.message && !settingsOpen" x-transition :class="toast.type" x-text="toast.message"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
